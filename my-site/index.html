<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>홍길동</h1>
    <p class="tagline">호기심 많고 꾸준히 성장하는 사람입니다.</p>
    <nav class="nav">
      <a href="#about">소개</a>
      <a href="#likes">좋아하는 것</a>
      <a href="#contact">연락처</a>
    </nav>
  </header>

  <main>
    <section id="about" class="section">
      <h2>소개</h2>
      <p>안녕하세요, 홍길동입니다. 새로운 것을 배우고 만드는 일을 좋아합니다. 이곳에 자신에 대한 이야기를 자유롭게 적어 보세요.</p>
    </section>

    <section id="likes" class="section">
      <h2>좋아하는 것 3가지</h2>
      <ul class="likes">
        <li class="card">
          <span class="emoji">☕</span>
          <h3>커피</h3>
          <p>향 좋은 커피 한 잔과 함께하는 여유.</p>
        </li>
        <li class="card">
          <span class="emoji">📚</span>
          <h3>독서</h3>
          <p>다양한 세계를 경험하게 해주는 책.</p>
        </li>
        <li class="card">
          <span class="emoji">🎵</span>
          <h3>음악</h3>
          <p>하루를 채워주는 좋은 노래들.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer" id="contact">
    <p>&copy; <span id="year"></span> 홍길동. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
